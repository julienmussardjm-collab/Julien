<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès privé</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffecd2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.5s ease;
      position: relative;
      z-index: 10;
    }

    .screen.active {
      display: block;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
      20%, 40%, 60%, 80% { transform: translateX(8px); }
    }

    .card.shake {
      animation: shake 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #e8788a;
      font-size: 1.8rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .subtitle {
      color: #b8a9c9;
      font-size: 0.95rem;
      margin-bottom: 28px;
      font-style: italic;
    }

    .question-text {
      color: #6b5b7a;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .hint-text {
      color: #c9a7b0;
      font-size: 0.8rem;
      margin-bottom: 28px;
      font-style: italic;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      color: #8b7a8e;
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #f0e6ef;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #faf8fa;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #e8788a;
      box-shadow: 0 0 0 4px rgba(232, 120, 138, 0.15);
    }

    .error-message {
      color: #e87878;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 6px;
    }

    .btn:focus {
      outline: 3px solid rgba(232, 120, 138, 0.5);
      outline-offset: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e8788a, #f4a5b0);
      color: white;
      width: 100%;
      margin: 0;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(232, 120, 138, 0.35);
    }

    .btn-hint {
      background: transparent;
      color: #b8a9c9;
      font-size: 0.85rem;
      padding: 10px 16px;
      margin-top: 16px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .btn-hint:hover {
      color: #8b7a8e;
    }

    .hint-reveal {
      color: #c9a7b0;
      font-size: 0.85rem;
      margin-top: 12px;
      font-style: italic;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .hint-reveal.visible {
      opacity: 1;
      max-height: 50px;
    }

    .password-hint-question {
      color: #6b5b7a;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #f8f4ff, #fff5f5);
      border-radius: 12px;
      border-left: 4px solid #e8788a;
    }

    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .btn-green {
      background: linear-gradient(135deg, #7ec8a3, #a8e6cf);
      color: white;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-green:hover {
      box-shadow: 0 8px 25px rgba(126, 200, 163, 0.4);
    }

    .btn-red {
      background: linear-gradient(135deg, #f4a5b0, #f8c4c4);
      color: white;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-red:hover {
      box-shadow: 0 6px 20px rgba(244, 165, 176, 0.4);
    }

    @keyframes microVibrate {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
    }

    .btn-red.vibrate {
      animation: microVibrate 0.15s ease 2;
    }

    .victory-title {
      color: #7ec8a3;
      font-size: 2.2rem;
      margin-bottom: 16px;
    }

    .victory-message {
      color: #8b7a8e;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-replay {
      background: linear-gradient(135deg, #b8a9c9, #d4c4e0);
      color: white;
    }

    .btn-replay:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(184, 169, 201, 0.4);
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    .floating-images-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floating-image {
      position: absolute;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 16px;
      opacity: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: opacity 1.5s ease;
      pointer-events: none;
    }

    .floating-image.visible {
      opacity: 0.85;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-15px) rotate(2deg); }
      50% { transform: translateY(-5px) rotate(-1deg); }
      75% { transform: translateY(-20px) rotate(-2deg); }
    }

    .floating-image.animate {
      animation: float 6s ease-in-out infinite;
    }

    /* Chat qui rebondit */
    #bouncing-cat {
      position: fixed;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      z-index: 5;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      h1 { font-size: 1.5rem; }
      .question-text { font-size: 1rem; }
      .btn { padding: 12px 20px; font-size: 0.95rem; }
      .buttons-container { flex-direction: column; align-items: center; }
      .btn-green, .btn-red { width: 100%; max-width: 250px; }
      .floating-image { width: 80px; height: 80px; }
      #bouncing-cat { width: 70px; height: 70px; }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div class="floating-images-container" id="floating-container"></div>
  
  <!-- Chat qui rebondit sur la page d'accueil -->
  <img id="bouncing-cat" src="Le%20chat.jpeg" alt="Nala" style="display: none;">

  <div id="screen-password" class="screen active">
    <div class="card" id="password-card">
      <h1>Accès privé</h1>
      <p class="subtitle">Petit test secret avant d'entrer.</p>
      <p class="password-hint-question" id="password-hint-question"></p>
      <div class="form-group">
        <label for="password-input">Mot de passe</label>
        <input type="password" id="password-input" placeholder="Entre le mot magique..." autocomplete="off">
      </div>
      <button class="btn btn-primary" id="submit-password">Entrer</button>
      <p class="error-message" id="error-message"></p>
      <button class="btn btn-hint" id="hint-btn">Indice</button>
      <p class="hint-reveal" id="hint-text"></p>
    </div>
  </div>

  <div id="screen-question" class="screen">
    <div class="card">
      <h1>La question</h1>
      <p class="question-text" id="question-text"></p>
      <p class="hint-text" id="question-hint"></p>
      <div class="buttons-container">
        <button class="btn btn-green" id="btn-green"></button>
        <button class="btn btn-red" id="btn-red"></button>
      </div>
    </div>
  </div>

  <div id="screen-victory" class="screen">
    <div class="card">
      <h1 class="victory-title" id="victory-title"></h1>
      <p class="victory-message" id="victory-message"></p>
      <button class="btn btn-replay" id="btn-replay">Rejouer</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      PASSWORD: "Nala",
      PASSWORD_HINT_QUESTION: "Qui tombe du dressing ?",
      HINT: "Un prénom qui nous suit partout.",
      QUESTION: "Qui tombe du dressing ?",
      QUESTION_HINT: "Tu connais la règle: mauvaise réponse = le bouton vert devient impossible à ignorer.",
      GREEN_PHRASES: [
        "Toi, évidemment.",
        "Toi.",
        "Toi, c'est évident.",
        "Réponse correcte: toi.",
        "Clique ici, c'est le destin.",
        "La bonne réponse: toi.",
        "Tu sais que c'est toi.",
        "Arrête de fuir, c'est toi.",
        "Toi, toujours toi.",
        "Accepte l'évidence: toi.",
        "C'est toi, point final.",
        "Toi, et personne d'autre."
      ],
      RED_PHRASES: [
        "Non.",
        "T'es sûre de toi ?",
        "Recalcul...",
        "Je te laisse une chance.",
        "C'est un piège très simple.",
        "Dernier essai.",
        "Vraiment ?",
        "Tu insistes ?",
        "Réfléchis encore.",
        "Mauvaise direction.",
        "Toujours pas ?",
        "Dernière tentative."
      ],
      VICTORY_TITLE: "Validé.",
      VICTORY_MESSAGE: "Accès accordé. Je savais que tu te souvenais.",
      FLOATING_IMAGES: [
        "WhatsApp%20Image%202026-02-17%20at%2019.34.05%20(1).jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.34.05.jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.35.00.jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.37.05%20(1).jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.37.05%20(2).jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.37.05%20(3).jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.37.05%20(4).jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.37.05%20(5).jpeg",
        "WhatsApp%20Image%202026-02-17%20at%2019.37.05.jpeg"
      ],
      CAT_IMAGE: "Le%20chat.jpeg"
    };

    let redClickCount = 0;
    let greenScale = 1;
    let redScale = 1;
    let floatingImagesInterval = null;
    
    // Variables pour le chat qui rebondit
    let catX = 50;
    let catY = 50;
    let catSpeedX = 2;
    let catSpeedY = 2;
    let catAnimationId = null;

    const screenPassword = document.getElementById('screen-password');
    const screenQuestion = document.getElementById('screen-question');
    const screenVictory = document.getElementById('screen-victory');
    const passwordCard = document.getElementById('password-card');
    const passwordInput = document.getElementById('password-input');
    const submitPassword = document.getElementById('submit-password');
    const errorMessage = document.getElementById('error-message');
    const hintBtn = document.getElementById('hint-btn');
    const hintText = document.getElementById('hint-text');
    const passwordHintQuestion = document.getElementById('password-hint-question');
    const questionText = document.getElementById('question-text');
    const questionHint = document.getElementById('question-hint');
    const btnGreen = document.getElementById('btn-green');
    const btnRed = document.getElementById('btn-red');
    const victoryTitle = document.getElementById('victory-title');
    const victoryMessage = document.getElementById('victory-message');
    const btnReplay = document.getElementById('btn-replay');
    const confettiCanvas = document.getElementById('confetti-canvas');
    const ctx = confettiCanvas.getContext('2d');
    const floatingContainer = document.getElementById('floating-container');
    const bouncingCat = document.getElementById('bouncing-cat');

    function init() {
      if (!sessionStorage.getItem('authenticated')) {
        showScreen('password');
      } else {
        showScreen('question');
      }
      passwordHintQuestion.textContent = CONFIG.PASSWORD_HINT_QUESTION;
      questionText.textContent = CONFIG.QUESTION;
      questionHint.textContent = CONFIG.QUESTION_HINT;
      hintText.textContent = CONFIG.HINT;
      btnGreen.textContent = CONFIG.GREEN_PHRASES[0];
      btnRed.textContent = CONFIG.RED_PHRASES[0];
      victoryTitle.textContent = CONFIG.VICTORY_TITLE;
      victoryMessage.textContent = CONFIG.VICTORY_MESSAGE;
      redClickCount = 0;
      greenScale = 1;
      redScale = 1;
      updateButtonScales();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
    }

    /* ============================================
       CHAT QUI REBONDIT
       ============================================ */
    function startBouncingCat() {
      bouncingCat.style.display = 'block';
      bouncingCat.src = CONFIG.CAT_IMAGE;
      
      // Position initiale aléatoire
      catX = Math.random() * (window.innerWidth - 100);
      catY = Math.random() * (window.innerHeight - 100);
      
      // Vitesse modérée (ni trop rapide, ni trop lente)
      catSpeedX = 2 * (Math.random() > 0.5 ? 1 : -1);
      catSpeedY = 2 * (Math.random() > 0.5 ? 1 : -1);
      
      animateBouncingCat();
    }
    
    function stopBouncingCat() {
      bouncingCat.style.display = 'none';
      if (catAnimationId) {
        cancelAnimationFrame(catAnimationId);
        catAnimationId = null;
      }
    }
    
    function animateBouncingCat() {
      const catWidth = bouncingCat.offsetWidth || 100;
      const catHeight = bouncingCat.offsetHeight || 100;
      
      // Mise à jour de la position
      catX += catSpeedX;
      catY += catSpeedY;
      
      // Rebond sur les bords horizontaux
      if (catX <= 0) {
        catX = 0;
        catSpeedX = Math.abs(catSpeedX);
      } else if (catX >= window.innerWidth - catWidth) {
        catX = window.innerWidth - catWidth;
        catSpeedX = -Math.abs(catSpeedX);
      }
      
      // Rebond sur les bords verticaux
      if (catY <= 0) {
        catY = 0;
        catSpeedY = Math.abs(catSpeedY);
      } else if (catY >= window.innerHeight - catHeight) {
        catY = window.innerHeight - catHeight;
        catSpeedY = -Math.abs(catSpeedY);
      }
      
      // Appliquer la position
      bouncingCat.style.left = catX + 'px';
      bouncingCat.style.top = catY + 'px';
      
      catAnimationId = requestAnimationFrame(animateBouncingCat);
    }

    function showScreen(screenName) {
      screenPassword.classList.remove('active');
      screenQuestion.classList.remove('active');
      screenVictory.classList.remove('active');
      stopFloatingImages();
      stopBouncingCat();
      
      switch(screenName) {
        case 'password':
          screenPassword.classList.add('active');
          passwordInput.focus();
          startBouncingCat();
          break;
        case 'question':
          screenQuestion.classList.add('active');
          startFloatingImages();
          break;
        case 'victory':
          screenVictory.classList.add('active');
          startConfetti();
          break;
      }
    }

    function createFloatingImage() {
      const img = document.createElement('img');
      img.classList.add('floating-image');
      const randomIndex = Math.floor(Math.random() * CONFIG.FLOATING_IMAGES.length);
      img.src = CONFIG.FLOATING_IMAGES[randomIndex];
      const maxX = window.innerWidth - 150;
      const maxY = window.innerHeight - 150;
      img.style.left = Math.random() * maxX + 'px';
      img.style.top = Math.random() * maxY + 'px';
      img.style.animationDelay = Math.random() * 2 + 's';
      floatingContainer.appendChild(img);
      setTimeout(() => { img.classList.add('visible', 'animate'); }, 100);
      const displayTime = 4000 + Math.random() * 3000;
      setTimeout(() => {
        img.classList.remove('visible');
        setTimeout(() => { if (img.parentNode) img.parentNode.removeChild(img); }, 1500);
      }, displayTime);
      return img;
    }

    function startFloatingImages() {
      setTimeout(() => createFloatingImage(), 500);
      setTimeout(() => createFloatingImage(), 1500);
      setTimeout(() => createFloatingImage(), 2500);
      floatingImagesInterval = setInterval(() => {
        const visibleImages = floatingContainer.querySelectorAll('.floating-image.visible');
        if (visibleImages.length < 4) createFloatingImage();
      }, 2500);
    }

    function stopFloatingImages() {
      if (floatingImagesInterval) {
        clearInterval(floatingImagesInterval);
        floatingImagesInterval = null;
      }
      floatingContainer.innerHTML = '';
    }

    function checkPassword() {
      const value = passwordInput.value.trim();
      if (value === CONFIG.PASSWORD) {
        sessionStorage.setItem('authenticated', 'true');
        errorMessage.textContent = '';
        passwordCard.style.opacity = '0';
        passwordCard.style.transform = 'translateY(-20px)';
        setTimeout(() => {
          showScreen('question');
          passwordCard.style.opacity = '1';
          passwordCard.style.transform = 'translateY(0)';
        }, 400);
      } else {
        errorMessage.textContent = "Ce n'est pas tout à fait ça...";
        passwordCard.classList.add('shake');
        setTimeout(() => { passwordCard.classList.remove('shake'); }, 500);
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    submitPassword.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPassword(); });
    hintBtn.addEventListener('click', () => { hintText.classList.toggle('visible'); });

    function updateButtonScales() {
      btnGreen.style.transform = 'scale(' + greenScale + ')';
      btnRed.style.transform = 'scale(' + redScale + ')';
    }

    function updateButtonTexts() {
      const greenIndex = Math.min(redClickCount, CONFIG.GREEN_PHRASES.length - 1);
      const redIndex = Math.min(redClickCount, CONFIG.RED_PHRASES.length - 1);
      btnGreen.textContent = CONFIG.GREEN_PHRASES[greenIndex];
      btnRed.textContent = CONFIG.RED_PHRASES[redIndex];
    }

    btnRed.addEventListener('click', () => {
      redClickCount++;
      greenScale = Math.min(greenScale + 0.15, 2.0);
      redScale = Math.max(redScale - 0.05, 0.7);
      updateButtonScales();
      updateButtonTexts();
      if (navigator.vibrate) navigator.vibrate(50);
      btnRed.classList.add('vibrate');
      setTimeout(() => { btnRed.classList.remove('vibrate'); }, 300);
    });

    btnGreen.addEventListener('click', () => { showScreen('victory'); });

    let confetti = [];
    let animationId = null;

    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    function createConfetti() {
      const colors = ['#e8788a', '#f4a5b0', '#7ec8a3', '#a8e6cf', '#b8a9c9', '#ffecd2', '#fcb69f'];
      for (let i = 0; i < 150; i++) {
        confetti.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * confettiCanvas.height - confettiCanvas.height,
          size: Math.random() * 10 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 3 + 2,
          speedX: Math.random() * 2 - 1,
          rotation: Math.random() * 360,
          rotationSpeed: Math.random() * 10 - 5
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confetti.forEach((c, index) => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rotation * Math.PI / 180);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
        ctx.restore();
        c.y += c.speedY;
        c.x += c.speedX;
        c.rotation += c.rotationSpeed;
        if (c.y > confettiCanvas.height + 20) {
          confetti[index].y = -20;
          confetti[index].x = Math.random() * confettiCanvas.width;
        }
      });
      animationId = requestAnimationFrame(drawConfetti);
    }

    function startConfetti() {
      confetti = [];
      createConfetti();
      drawConfetti();
      setTimeout(() => {
        if (animationId) {
          cancelAnimationFrame(animationId);
          ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
      }, 5000);
    }

    btnReplay.addEventListener('click', () => {
      sessionStorage.removeItem('authenticated');
      passwordInput.value = '';
      errorMessage.textContent = '';
      hintText.classList.remove('visible');
      redClickCount = 0;
      greenScale = 1;
      redScale = 1;
      updateButtonScales();
      btnGreen.textContent = CONFIG.GREEN_PHRASES[0];
      btnRed.textContent = CONFIG.RED_PHRASES[0];
      if (animationId) {
        cancelAnimationFrame(animationId);
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
      confetti = [];
      showScreen('password');
    });

    init();
  </script>
</body>
</html>
